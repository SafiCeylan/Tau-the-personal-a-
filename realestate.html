<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Emlak 3D - Örnek</title>
  <style>
    body{margin:0;overflow:hidden;font-family:Arial, Helvetica, sans-serif;background:#081018}
    #infoBar{position:absolute;left:12px;top:12px;color:#0ff3b2;background:rgba(0,0,0,0.45);padding:8px 12px;border-radius:6px;font-weight:700}
    #panel{position:absolute;right:18px;top:18px;width:300px;background:linear-gradient(180deg,#071219, #0a1a21);color:#cfeff0;padding:14px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,0.7);backdrop-filter:blur(6px)}
    #panel h3{margin:0 0 8px 0;color:#00ffd1}
    #panel p{margin:4px 0}
    #closeBtn{background:#001f26;color:#9ff1e6;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;margin-top:8px}
    #list{position:absolute;left:12px;bottom:12px;max-height:220px;overflow:auto;width:220px;background:rgba(0,0,0,0.45);padding:8px;border-radius:6px}
    .item{padding:6px;border-radius:6px;margin-bottom:6px;background:transparent;color:#bfffe9;cursor:pointer}
    .item:hover{background:rgba(255,255,255,0.03)}
    canvas{display:block}
  </style>
</head>
<body>
  <div id="infoBar">3B Emlak - Binalara tıkla, detay gör</div>
  <div id="panel" hidden>
    <h3 id="title">---</h3>
    <p id="desc">Seçili mülk bilgisi burada gösterilecek.</p>
    <p id="price"></p>
    <button id="closeBtn">Kapat</button>
  </div>
  <div id="list"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Scene + camera + renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06121a);

    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(8,6,12);

    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,1,0);
    controls.enableDamping = true;

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60,60),
      new THREE.MeshStandardMaterial({color:0x07121b, roughness:0.9})
    );
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // Lights
    const hemi = new THREE.HemisphereLight(0xbfe6ff, 0x0b262a, 0.7);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(5,10,2);
    scene.add(dir);

    // Central building (big)
    const centralMat = new THREE.MeshStandardMaterial({color:0x203a60, metalness:0.4, roughness:0.3});
    const central = new THREE.Mesh(new THREE.BoxGeometry(4,8,4), centralMat);
    central.position.set(0,4,0);
    scene.add(central);

    // Sample houses array
    const houses = [];
    const houseMat = new THREE.MeshStandardMaterial({color:0xe35b4a, metalness:0.2, roughness:0.5});

    const sampleData = [
      {title: 'Daire A', rooms:'3+1', area:'90 m²', price:'₺1.200.000', pos:[-8,0.6,-4]},
      {title: 'Daire B', rooms:'2+1', area:'75 m²', price:'₺980.000', pos:[-8,0.6,0]},
      {title: 'Daire C', rooms:'4+1', area:'140 m²', price:'₺2.300.000', pos:[-8,0.6,4]},
      {title: 'Villa D', rooms:'3+2', area:'110 m²', price:'₺3.100.000', pos:[8,0.6,-3]},
      {title: 'Villa E', rooms:'2+1', area:'85 m²', price:'₺1.700.000', pos:[8,0.6,3]}
    ];

    for(let i=0;i<sampleData.length;i++){
      const d = sampleData[i];
      const g = new THREE.BoxGeometry(2.2,1.2,1.8);
      const m = houseMat.clone();
      // küçük varyasyon ekleyelim
      m.color = new THREE.Color().setHSL(0.02 + i*0.02, 0.7, 0.5);
      m.emissive = new THREE.Color(0x000000);
      const mesh = new THREE.Mesh(g, m);
      mesh.position.set(d.pos[0], d.pos[1], d.pos[2]);
      mesh.userData = {title: d.title, rooms: d.rooms, area: d.area, price: d.price};
      scene.add(mesh);
      houses.push(mesh);
    }

    // UI elements
    const panel = document.getElementById('panel');
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');
    const priceEl = document.getElementById('price');
    const closeBtn = document.getElementById('closeBtn');
    const listEl = document.getElementById('list');

    // Populate list for quick focus
    houses.forEach((h, idx) => {
      const it = document.createElement('div');
      it.className = 'item';
      it.textContent = h.userData.title + ' — ' + h.userData.rooms + ' • ' + h.userData.area;
      it.addEventListener('click', () => {
        // focus camera
        const p = h.position;
        controls.target.copy(p);
        camera.position.set(p.x + 6 * Math.sign(p.x||1), p.y + 3, p.z + 6);
        controls.update();
        showInfo(h.userData, h);
      });
      listEl.appendChild(it);
    });

    // Raycaster for pointer interaction
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hovered = null;
    let selected = null;

    function onPointerMove(e){
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = - (e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const ints = raycaster.intersectObjects(houses);
      if(ints.length){
        document.body.style.cursor = 'pointer';
        const obj = ints[0].object;
        if(hovered !== obj){
          if(hovered && hovered !== selected) hovered.material.emissive.setHex(0x000000);
          hovered = obj;
          if(hovered !== selected) hovered.material.emissive.setHex(0x003333);
        }
      } else {
        document.body.style.cursor = 'default';
        if(hovered && hovered !== selected) hovered.material.emissive.setHex(0x000000);
        hovered = null;
      }
    }

    function onClick(e){
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = - (e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const ints = raycaster.intersectObjects(houses);
      if(ints.length){
        const obj = ints[0].object;
        if(selected && selected !== obj) selected.material.emissive.setHex(0x000000);
        selected = obj;
        selected.material.emissive.setHex(0x005555);
        // focus camera
        const p = obj.position;
        controls.target.copy(p);
        camera.position.set(p.x + 6 * Math.sign(p.x||1), p.y + 3, p.z + 6);
        controls.update();
        showInfo(obj.userData, obj);
      }
    }

    function showInfo(data, obj){
      titleEl.textContent = data.title;
      descEl.textContent = data.rooms + ' • ' + data.area;
      priceEl.textContent = data.price;
      panel.hidden = false;
    }

    closeBtn.addEventListener('click', ()=>{ panel.hidden = true; if(selected){ selected.material.emissive.setHex(0x000000); selected=null;} });
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('click', onClick);

    // Animate
    function animate(){
      requestAnimationFrame(animate);
      central.rotation.y += 0.002;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
