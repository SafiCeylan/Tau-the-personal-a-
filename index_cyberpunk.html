<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Başlangıç - Tau Vibe</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #00ff88;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">Mous ile gezinebilirsin (Sol tık döndür, sağ tık taşı)</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. SAHNE KURULUMU (Scene)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); // Koyu gri arka plan
        // Sis efekti ekleyelim, derinlik katar
        scene.fog = new THREE.FogExp2(0x111111, 0.02);

        // 2. KAMERA (Camera)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // 3. RENDERER (Görüntüleyici)
        const renderer = new THREE.WebGLRenderer({ antialias: true }); // Antialias kenarları yumuşatır
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Yüksek çözünürlüklü ekranlar için
        document.body.appendChild(renderer.domElement);

        // 4. KONTROLLER (OrbitControls)
        // Mouse ile sahneyi döndürmeni sağlar
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Daha yumuşak duruş sağlar

        // 5. OBJE (Geometry & Material)
        // Karmaşık bir şekil: TorusKnot (Düğüm)
        const geometry = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
        
        // Materyal: Işığa tepki veren, tel kafes (wireframe) görünümlü neon materyal
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xff0000, // Kırmızı
            roughness: 0.1,
            metalness: 0.8,
            wireframe: false  // Solid görünüm
        });

        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);

        // 6. IŞIKLANDIRMA (Lights)
        // Ortam ışığı
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Noktasal ışık (Parlaklık versin diye)
        const pointLight = new THREE.PointLight(0xffffff, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // 7. ANİMASYON DÖNGÜSÜ (Game Loop)
        function animate() {
            requestAnimationFrame(animate);

            // Objeyi sürekli kendi ekseninde döndür
            torusKnot.rotation.x += 0.01;
            torusKnot.rotation.y += 0.005;

            // Kontrollerin güncellenmesi lazım (damping için)
            controls.update();

            renderer.render(scene, camera);
        }

        // 8. EKRAN BOYUTU DEĞİŞİRSE (Responsive)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Başlat
        animate();
    </script>
</body>
</html>
